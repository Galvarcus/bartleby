name: Windows tools cache
description: >-
  Answer with the key, the folders, and the program folders of the cache
  that holds MiKTeX and Pandoc, so that the workflow which writes the entry
  and the jobs which read it cannot disagree about any of them.

outputs:
  key:
    description: The key of the cache entry.
    value: ${{ steps.answer.outputs.key }}
  paths:
    description: The folders that the entry holds, one to a line.
    value: ${{ steps.answer.outputs.paths }}
  bins:
    description: The folders of the programs, one to a line, for the PATH.
    value: ${{ steps.answer.outputs.bins }}
  roots:
    description: The roots of MiKTeX, one to a line, for registering them.
    value: ${{ steps.answer.outputs.roots }}

runs:
  using: composite
  steps:
    # The key names no version of MiKTeX, because the entry holds the
    # install itself, so the entry is the version. That is the point of it:
    # MiKTeX ships a new version whenever it likes, and the Chocolatey
    # package fetches whatever that is, so a key naming the version would
    # miss the entry and fail a branch for a reason nothing on the branch
    # changed. Bump EPOCH to take a newer MiKTeX on purpose.
    #
    # The digest covers what decides the contents: how MiKTeX is installed,
    # the warm-up and the parser that chooses what it fetches, and the
    # templates that name the classes and packages.
    - name: Answer with the key and the folders
      id: answer
      shell: bash
      env:
        EPOCH: v3
      run: |
        digest=$(cat \
          .github/actions/install-miktex/action.yml \
          .github/scripts/warm-miktex.sh \
          .github/scripts/latex-needs.vim \
          autoload/bartleby/texcheck.vim \
          tools/latex/*.tex | sha256sum | cut -c1-16)
        echo "key=windows-tools-$EPOCH-$digest" >> "$GITHUB_OUTPUT"

        # MiKTeX keeps the install under Program Files, its shared config
        # under ProgramData, the format files under Local, and the packages
        # it fetches under Roaming. Pandoc is one folder of its own. The
        # DejaVu fonts are not here: a font is usable because it is
        # registered, and a cache carries files and not registry values.
        # Windows names these with mixed case and the Git Bash does not
        # offer every one of them in upper case: PROGRAMDATA came through
        # empty and left a root of /MiKTeX, so the shared configuration of
        # MiKTeX was never in the entry at all. Each one is checked for a
        # drive letter, because a root that is silently wrong costs a run
        # to find.
        prog=${PROGRAMFILES:-${ProgramFiles:-}}
        data=${PROGRAMDATA:-${ProgramData:-}}
        home=${USERPROFILE:-${UserProfile:-}}
        for name in prog data home; do
          eval "value=\$$name"
          case "$value" in
            ?:*) ;;
            *)
              echo "::error::$name came out as '$value', which names no folder of Windows. The entry would hold the wrong roots."
              exit 1
              ;;
          esac
        done
        prog=${prog//\\//}
        data=${data//\\//}
        home=${home//\\//}
        {
          echo 'paths<<PATHS'
          echo "$prog/MiKTeX"
          echo "$data/MiKTeX"
          echo "$home/AppData/Local/MiKTeX"
          echo "$home/AppData/Roaming/MiKTeX"
          echo "$prog/Pandoc"
          echo 'PATHS'
          echo 'bins<<BINS'
          echo "$prog/MiKTeX/miktex/bin/x64"
          echo "$prog/Pandoc"
          echo 'BINS'
          # The four that initexmf --report names as Root0 to Root3. A
          # machine that restored them knows nothing of them, so the
          # compile leg registers them again.
          echo 'roots<<ROOTS'
          echo "$home/AppData/Roaming/MiKTeX"
          echo "$home/AppData/Local/MiKTeX"
          echo "$data/MiKTeX"
          echo "$prog/MiKTeX"
          echo 'ROOTS'
        } >> "$GITHUB_OUTPUT"
