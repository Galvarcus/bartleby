name: Install Vim
description: >-
  Install the latest Vim, so that Vim is on the PATH: on Linux from the
  vim-appimage releases, unpacked, and on Windows from the
  vim-win32-installer releases. The Vim of the runner is too old for the
  Vim9 features that Bartleby uses, and the runner of Windows has none.
  tests/harness.vim checks the patch level.

  The action sets VIM_EXE to the Vim that it installed, and a job must use
  it instead of the name vim: the Git Bash of the Windows runner holds a
  Vim of its own, in its /usr/bin, which comes first and is both older and
  a build for Unix, where has('win32') is false.
runs:
  using: composite
  steps:
    - name: Download and unpack the AppImage
      if: runner.os != 'Windows'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # With the token, the call has the limit of the repository. Without
        # one it shares a low limit with every other runner.
        url=$(curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/vim/vim-appimage/releases/latest \
          | jq -r '.assets[] | select(.name | test("^Vim-v.*-x86_64\\.AppImage$")) | .browser_download_url')
        if [ -z "$url" ]; then
          echo "::error::The latest vim-appimage release has no Vim AppImage."
          exit 1
        fi
        curl -fsSL --retry 3 -o /tmp/vim.appimage "$url"
        chmod +x /tmp/vim.appimage
        cd /tmp && ./vim.appimage --appimage-extract > /dev/null
        ln -s /tmp/squashfs-root/AppRun /tmp/squashfs-root/vim
        echo "/tmp/squashfs-root" >> "$GITHUB_PATH"
        echo "VIM_EXE=/tmp/squashfs-root/vim" >> "$GITHUB_ENV"

    # PowerShell, because the runner of Windows has neither jq nor unzip of
    # its own, and Invoke-RestMethod reads the release by itself.
    - name: Download and unpack the Windows build
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $headers = @{Authorization = "Bearer $env:GITHUB_TOKEN"}
        $release = Invoke-RestMethod -Headers $headers `
          -Uri 'https://api.github.com/repos/vim/vim-win32-installer/releases/latest'
        $asset = $release.assets |
          Where-Object {$_.name -match '^gvim_[0-9.]+_x64\.zip$'} |
          Select-Object -First 1
        if (-not $asset) {
          Write-Output '::error::The latest vim-win32-installer release has no x64 zip.'
          exit 1
        }
        $zip = Join-Path $env:RUNNER_TEMP 'vim.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'vim'
        Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir
        # The zip holds vim.exe in a folder of its version, such as
        # vim/vim92, which the next release renames.
        $exe = Get-ChildItem -Path $dir -Recurse -Filter 'vim.exe' | Select-Object -First 1
        if (-not $exe) {
          Write-Output '::error::The Vim zip holds no vim.exe.'
          exit 1
        }
        Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
        # Forward slashes, so that the Git Bash of a job can run it.
        Add-Content -Path $env:GITHUB_ENV -Value "VIM_EXE=$($exe.FullName -replace '\\', '/')"

    - name: Vim version
      shell: bash
      run: |
        "$VIM_EXE" --version
