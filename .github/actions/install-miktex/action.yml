name: Install MiKTeX
description: >-
  Install MiKTeX on a Windows runner with Chocolatey and put it on the
  PATH, so that a job can check what Bartleby does with the one TeX
  distribution that installs a missing package while it compiles. The
  install is set to take a package without asking, because a prompt would
  hang a job that has no one to answer it. The action fails unless
  initexmf, the program that tells MiKTeX from another distribution, then
  runs.
runs:
  using: composite
  steps:
    - name: Install MiKTeX
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        choco install miktex --no-progress -y
        # 3010 is a reboot that MiKTeX does not need for its programs.
        if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
          Write-Output "::error::choco install miktex failed with $LASTEXITCODE."
          exit $LASTEXITCODE
        }
        # Chocolatey puts MiKTeX on the PATH of the machine, which the
        # steps of this job do not read again, and the folder of its
        # programs holds the version of MiKTeX. A per user install is
        # under LOCALAPPDATA instead.
        $roots = @(
          (Join-Path $env:ProgramFiles 'MiKTeX'),
          (Join-Path ${env:ProgramFiles(x86)} 'MiKTeX'),
          (Join-Path $env:LOCALAPPDATA 'Programs\MiKTeX')
        ) | Where-Object {$_ -and (Test-Path $_)}
        $exe = $roots |
          ForEach-Object {Get-ChildItem -Path $_ -Recurse -Filter 'initexmf.exe' -ErrorAction SilentlyContinue} |
          Select-Object -First 1
        if (-not $exe) {
          Write-Output '::error::The MiKTeX install holds no initexmf.exe.'
          exit 1
        }
        Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
        exit 0

    # A fresh install asks before it installs a package, which is the 2 of
    # AutoInstall. 1 takes the package without asking. Both the shared
    # settings, with --admin, and those of the user, because either can
    # answer first.
    - name: Take packages without asking
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        initexmf --admin --set-config-value=[MPM]AutoInstall=1
        initexmf --set-config-value=[MPM]AutoInstall=1
        Write-Output "AutoInstall: $(initexmf --show-config-value=[MPM]AutoInstall)"
        kpsewhich --version
        exit 0
