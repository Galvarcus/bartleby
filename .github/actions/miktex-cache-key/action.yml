name: MiKTeX cache key
description: >-
  Answer with the key, the folders, the portable tree, and the package
  repository of the cache that holds the MiKTeX a compile needs, so that
  the workflow which writes the entry and the jobs which read it cannot
  disagree about any of them.

inputs:
  set:
    description: The package set the tree is made from.
    default: basic

outputs:
  key:
    description: The key of the cache entry.
    value: ${{ steps.key.outputs.key }}
  paths:
    description: The folders that the entry holds, one to a line.
    value: ${{ steps.key.outputs.paths }}
  tree:
    description: The folder of the portable MiKTeX in the entry.
    value: ${{ steps.key.outputs.tree }}
  repo:
    description: The folder of the local package repository in the entry.
    value: ${{ steps.key.outputs.repo }}
  set:
    description: The package set the tree is made from.
    value: ${{ inputs.set }}

runs:
  using: composite
  steps:
    # The key names no version of MiKTeX, and it asks the runner for
    # nothing: the leg that reads the entry has no MiKTeX at all before
    # the restore, because the entry is the MiKTeX. The version was in
    # the key while format files were cached without the engines that
    # built them, where a newer engine would read a stale format. A whole
    # tree carries engine and format together, so that cannot happen.
    #
    # The epoch is therefore the only thing that retires an entry, and it
    # is deliberate: CI keeps the MiKTeX of the last seeding run until
    # someone raises the epoch, which is determinism rather than a
    # distribution that changes under a test. The files that decide what
    # the entry holds name it as well, so a new class, package, or script
    # makes a new entry on its own.
    - name: Build the key and the folders
      id: key
      shell: bash
      env:
        PREFIX: windows-miktex-v1
        SET: ${{ inputs.set }}
      run: |
        digest=$(cat \
          .github/scripts/make-portable-miktex.sh \
          .github/scripts/warm-miktex.sh \
          .github/scripts/make-tex-repo.sh \
          .github/scripts/latex-needs.vim \
          autoload/bartleby/texcheck.vim \
          tools/latex/*.tex | sha256sum | cut -c1-16)
        echo "key=$PREFIX-$SET-$digest" >> "$GITHUB_OUTPUT"

        # The two folders of the entry. The portable tree, which holds
        # the programs, the packages, and the format files, and which
        # keeps its configuration in itself rather than in the registry
        # of the host, so a restore needs nothing of the runner. And the
        # package repository, so that a package install which a compile
        # starts reads a folder instead of a server.
        tree=C:/miktex-portable
        repo=C:/bartleby-tex-repo
        {
          echo "tree=$tree"
          echo "repo=$repo"
          echo 'paths<<PATHS'
          echo "$tree"
          echo "$repo"
          echo 'PATHS'
        } >> "$GITHUB_OUTPUT"
