name: Generate Vimdoc
on:
  push:
    branches:
      - main
      - Development
    paths:
      - README.md
      - doc/pandoc.yaml
      - doc/vimdoc-filter.lua
      - .github/workflows/vimdoc.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vimdoc:
    name: Generate Vimdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --shift-heading-level-by=-1 makes the README's single H1 the
      # document title instead of a section. The H1 repeats the title line
      # of the help file, and as a section its tag would be the doubled
      # bartleby-bartleby. Keep exactly one H1 in README.md, at the top.
      - name: Generate Vimdoc
        uses: docker://pandoc/core:3.8
        with:
          args: >-
            README.md
            --from=markdown
            --to=vimdoc
            --standalone
            --columns=78
            --toc=true
            --shift-heading-level-by=-1
            --metadata-file=doc/pandoc.yaml
            --lua-filter=doc/vimdoc-filter.lua
            --output=doc/bartleby.txt

      - name: Commit generated Vimdoc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/bartleby.txt
          if git diff --cached --quiet; then
            echo "doc/bartleby.txt is current."
            exit 0
          fi
          git commit -m "docs: regenerate Vimdoc"
          git push origin HEAD:${{ github.ref_name }}
