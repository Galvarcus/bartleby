name: Publish Wiki
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - Users_Guide.md
      - Localization_README.md
  workflow_dispatch:
permissions:
  contents: write
# One run at a time, so two pushes cannot race to push the wiki.
concurrency:
  group: publish-wiki
  cancel-in-progress: false
jobs:
  wiki:
    name: Publish Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The wiki is its own repository, <owner>/<name>.wiki. With
      # contents: write, the workflow's own token can push to it. Only if
      # GitHub refuses that, add a fine-grained personal access token for
      # this repository, with Contents: Read and write, as the secret
      # WIKI_TOKEN. Nothing else needs to change.
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.WIKI_TOKEN || github.token }}

      - name: Test the converter
        run: python3 -m unittest discover -s tools/wiki -p 'test_*.py'

      # Images and relative links load from main, so a changed image shows
      # in the wiki without a new run.
      - name: Build the wiki pages
        run: python3 tools/wiki/build_wiki.py --wiki wiki --repo "${{ github.repository }}" --branch main

      - name: Commit and push the wiki
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is current."
            exit 0
          fi
          git commit -m "docs: rebuild the wiki from ${GITHUB_SHA::7}"
          git push
