name: Documentation Issue
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Help us keep the plugin's README and `:help` documentation accurate and up-to-date.
  - type: dropdown
    id: doc-type
    attributes:
      label: Type of documentation issue
      options:
        - Typo or grammatical error
        - Missing information / Undocumented feature
        - Unclear or confusing explanation
        - Outdated configuration examples
        - Other
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File or Help Tag
      description: Which file or `:help` tag does this issue relate to?
      placeholder: e.g., README.md, doc/plugin.txt, or `:h plugin-options`
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the issue
      description: Please describe what is wrong with the current documentation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: If you know how to fix it, please provide the suggested text.
    validations:
      required: false
