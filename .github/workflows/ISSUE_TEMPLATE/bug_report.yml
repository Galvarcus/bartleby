name: Bug Report
description: Create a bug report to help improve Bartleby
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Please ensure you have updated the plugin to the latest commit before submitting.
  - type: input
    id: version
    attributes:
      label: Vim version
      description: Output of `vim --version`
      placeholder: e.g., VIM - Vi IMproved 9.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: e.g., macOS 14.1, Ubuntu 22.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Open a new file
        2. Run command `:PluginCommand`
        3. Press 'x'
    validations:
      required: true
  - type: textarea
    id: minimal-config
    attributes:
      label: Minimal vimrc
      description: Provide a minimal `vimrc` configuration to reproduce the issue.
      render: vim
      placeholder: |
        set nocompatible
        " Add only the minimal config required to load the plugin and reproduce the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Error messages
      description: What actually happened? Paste any error messages here.
      render: vim
    validations:
      required: true
