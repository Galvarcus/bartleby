name: Windows tools cache

##############################################################################
# Installing MiKTeX takes between 86 and 156 seconds, Pandoc another 12,
# and the packages and format files that a compile needs over a hundred
# more. Every compile job paid for all of it. This workflow does it once
# and saves it as a cache entry that the Windows compile leg of ci.yml
# restores.
#
# The entry freezes the version of MiKTeX, which the Chocolatey package
# otherwise picks for itself on every run. Bump EPOCH in
# .github/actions/windows-tools-cache to take a newer one.
#
# A cache entry that a run on the default branch writes is readable from
# every branch, so the push and the schedule both aim at main. An entry that
# nothing reads for seven days falls out, which is why the schedule runs
# twice a week rather than weekly. A run started by hand writes an entry for
# its own branch, which is how to seed a change to the install or the
# templates before it reaches main.
# REFERENCE: https://github.com/Galvarcus/bartleby/issues/46
##############################################################################

on:
  push:
    branches: [main]
    paths:
      - .github/actions/install-miktex/action.yml
      - .github/actions/windows-tools-cache/action.yml
      - .github/scripts/warm-miktex.sh
      - .github/scripts/latex-needs.vim
      - autoload/bartleby/texcheck.vim
      - tools/latex/**
      - .github/workflows/windows-cache.yml
  schedule:
    - cron: '0 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    name: Make the Windows tools cache
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The warm-up asks texcheck.vim which files the templates name, so it
      # needs a Vim with Logger on the runtimepath.
      - name: Install Vim
        uses: ./.github/actions/install-vim

      - name: Checkout Logger dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: Galvarcus/Logger
          path: deps/Logger

      - name: Build the cache key
        id: key
        uses: ./.github/actions/windows-tools-cache

      # Look before installing anything: a save over an entry that exists
      # is refused, so there is nothing to do when one is already there.
      - name: Look for the entry
        id: found
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ steps.key.outputs.paths }}
          lookup-only: true

      - name: Say what was found
        shell: bash
        env:
          KEY: ${{ steps.key.outputs.key }}
          HIT: ${{ steps.found.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            echo "$KEY is already saved. Nothing to do."
          else
            echo "$KEY is not saved. Making it."
          fi

      - name: Install MiKTeX
        if: steps.found.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-miktex

      # Pandoc goes in the entry as well. The DejaVu fonts do not, because
      # a font is usable when it is registered and a cache holds no
      # registry values, so the compile leg installs those itself.
      - name: Install pandoc
        if: steps.found.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install pandoc --no-progress --yes

      - name: Fetch what the templates need
        if: steps.found.outputs.cache-hit != 'true'
        shell: bash
        run: .github/scripts/warm-miktex.sh

      - name: Save the entry
        if: steps.found.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ steps.key.outputs.paths }}
