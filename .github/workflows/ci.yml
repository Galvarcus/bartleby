name: CI

# The stages, in order:
#
#   changes -> the test jobs -> tests -> ghostcode, vimdoc, wiki -> cheatsheet
#
# tests is a gate. When any test job fails, nothing after it runs. The three
# jobs after it run side by side, and none of them blocks another. The cheat
# sheet job runs after them, whatever their results, and checks out the
# branch as they left it, so that its commit does not conflict with theirs.
#
# The TeX check on MiKTeX runs on Windows, because MiKTeX is the one
# distribution that installs a missing package while it compiles, and no
# Linux job can prove what Bartleby does with it. That job installs MiKTeX
# itself, see .github/actions/install-miktex.
#
# Vim is installed first in each job that needs it. The compile smoke test,
# the cheat sheet converter tests, and the cheat sheet run in the CI image,
# which holds their TeX packages, tools, and pandocs, see
# .github/docker/Dockerfile and ci-image.yml. Every other
# package is installed in the job that needs it, just before the step that
# does.
on:
  push:
    branches:
      - main
      - Development
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push waits for the run before it, because the jobs that commit must
# not be cut off. A new commit to a pull request replaces the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Which parts of the repository changed. A manual run does everything.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
      wiki: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.wiki }}
      vimdoc: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.vimdoc }}
      cheatsheet: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.cheatsheet }}
      triage: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.triage }}
      texcheck: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.texcheck }}
      compile: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.compile }}
      windows: ${{ steps.legs.outputs.legs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Find the changed parts
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            code:
              - autoload/**
              - plugin/**
              - syntax/**
              - ftdetect/**
              - colors/**
              - import/**
              - lang/**
              - tests/**
              - tools/i18n/**
              - .github/workflows/ci.yml
              - .github/actions/**
            wiki:
              - README.md
              - Users_Guide.md
              - Localization_README.md
              - tools/wiki/**
              - .github/workflows/ci.yml
              - .github/actions/**
            vimdoc:
              - README.md
              - doc/pandoc.yaml
              - doc/vimdoc-filter.lua
              - .github/workflows/ci.yml
              - .github/actions/**
            cheatsheet:
              - doc/cheatsheet.md
              - tools/cheatsheet/**
              - .github/workflows/ci.yml
              - .github/actions/**
            triage:
              - .github/scripts/**
              - .github/ISSUE_TEMPLATE/**
              - .github/workflows/issue-triage.yml
              - .github/workflows/ci.yml
            texcheck:
              - autoload/bartleby/texcheck.vim
              - autoload/bartleby/compile.vim
              - tools/latex/**
              - tests/test_texcheck_miktex.vim
              - .github/workflows/ci.yml
              - .github/actions/**
            compile:
              - autoload/bartleby/compile.vim
              - autoload/bartleby/texcheck.vim
              - tools/latex/**
              - tools/pandoc/**
              - tools/css/**
              - tests/test_compile_smoke.vim
              - .github/scripts/compile-smoke.sh
              - .github/scripts/check-windows-tools.sh
              - .github/scripts/warm-miktex.sh
              - .github/scripts/latex-needs.vim
              - .github/workflows/ci.yml
              - .github/actions/**

      # One job runs the Windows legs, and a job has one condition for all
      # of them, so the legs that their own filters choose are named here.
      # A workflow_dispatch runs every leg, as it sets every filter.
      - name: Choose the Windows legs
        id: legs
        shell: bash
        env:
          CODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
          TEXCHECK: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.texcheck }}
          COMPILE: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.compile }}
        run: |
          legs=''
          if [ "$CODE" = true ]; then
            legs="$legs\"unit\","
          fi
          if [ "$TEXCHECK" = true ]; then
            legs="$legs\"texcheck\","
          fi
          if [ "$COMPILE" = true ]; then
            legs="$legs\"compile\","
          fi
          echo "legs=[${legs%,}]" >> "$GITHUB_OUTPUT"

  ##########################################################################
  # The tests. Each installs only what it needs.
  ##########################################################################

  unit:
    name: Unit and buffer tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # A prebuilt AppImage of the latest Vim. Ubuntu's Vim lags too far
      # behind Vim9's class system, for example a class field typed as a list
      # of its own class, and the tests need patch 9.2.1172 or later.
      - name: Install Vim
        uses: ./.github/actions/install-vim

      # Bartleby's autoload files import 'Logger/logger.vim', a shared
      # dependency (github.com/Galvarcus/Logger) that is not in this repo.
      - name: Checkout Logger dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: Galvarcus/Logger
          path: deps/Logger

      # Every IN.T and IN.N call must have literal text, and the template
      # must list all of them. See Localization_README.md.
      - name: Check the translation template
        run: python3 tools/i18n/extract.py --check

      # msgfmt checks the translations, and tests/test_i18n.vim compiles a
      # small German translation with it and switches Vim's message
      # language to German. Without them that test skips its check.
      - name: Install gettext and a German locale
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext locales
          sudo locale-gen de_DE.UTF-8

      - name: Check the translations
        run: |
          for po in lang/*.po; do
            if [ -e "$po" ]; then
              msgfmt --check -o /dev/null "$po"
            fi
          done

      - name: Run tests
        run: |
          vim -es -u NONE -N -V20/tmp/vim.log \
            -c 'set rtp+=.,deps/Logger' \
            -c 'source tests/harness.vim' -c 'quit' || true
          if [ ! -f tests/results.txt ]; then
            echo "::error::tests/results.txt was never created - Vim likely failed before finishing. Verbose log follows:"
            cat /tmp/vim.log
            exit 1
          fi
          cat tests/results.txt
          grep -qx 'All tests passed' tests/results.txt

  # The smoke tests run with the pandoc of the distro and with a current
  # release, as Homebrew has, in a job for each, so that both results come
  # in the time of one. A newer pandoc can need changes in the templates,
  # see tools/latex. Both pandocs and the TeX packages are in the CI image,
  # see .github/docker/Dockerfile, which sets PANDOC_RELEASE.
  compile-smoke:
    name: Compile pipeline smoke test (pandoc ${{ matrix.pandoc }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Both jobs run to the end, so that a failure with one pandoc still
    # gives the result of the other.
    strategy:
      fail-fast: false
      matrix:
        pandoc: [distro, release]
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Vim
        uses: ./.github/actions/install-vim

      - name: Checkout Logger dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: Galvarcus/Logger
          path: deps/Logger

      - name: Check the CI image
        run: .github/scripts/check-ci-image.sh

      # The release pandoc is in a folder of its own, so only its job puts
      # it first on PATH.
      - name: Run compile smoke test
        run: |
          if [ "${{ matrix.pandoc }}" = release ]; then
            PATH="/opt/pandoc-$PANDOC_RELEASE/bin:$PATH"
          fi
          .github/scripts/compile-smoke.sh

  ##########################################################################
  # The Windows legs, in one job with a leg for each. The runner differs in
  # its paths, its shell, and in what executable() answers, and a fault
  # there is a fault of the plugin, so a break holds the Tests gate.
  # REFERENCE: https://github.com/Galvarcus/bartleby/issues/43
  #
  # fail-fast stays off, so that one leg does not cancel the others, as the
  # three jobs before it did not. Every leg takes the longer timeout:
  # Windows has no timeout to stop a second Vim that hangs, see Limit in
  # tests/fixtures.vim.
  ##########################################################################
  windows:
    name: Windows (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.windows != '[]'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.changes.outputs.windows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Vim
        uses: ./.github/actions/install-vim

      - name: Checkout Logger dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: Galvarcus/Logger
          path: deps/Logger

      - name: Install MiKTeX
        if: matrix.leg != 'unit'
        uses: ./.github/actions/install-miktex

      # MiKTeX brings the engines. The runner has neither pandoc nor the
      # DejaVu Serif that the Book PDF asks of fontspec, which the CI image
      # takes from fonts-dejavu-core, see .github/docker/Dockerfile. A TeX
      # package cannot stand in for it, because XeTeX reads the fonts of
      # the system.
      - name: Install pandoc and the DejaVu fonts
        if: matrix.leg == 'compile'
        shell: pwsh
        run: choco install pandoc dejavufonts --no-progress --yes

      # Before the fetch, so that a missing program fails in seconds rather
      # than after it.
      - name: Check that Vim finds the tools
        if: matrix.leg == 'compile'
        shell: bash
        run: .github/scripts/check-windows-tools.sh

      # The packages and the format files come from the entry that
      # .github/workflows/windows-cache.yml writes, because making them
      # takes over a hundred seconds in a job that spends three hundred.
      # A miss fails the leg rather than quietly making them again: run
      # that workflow by hand to seed this branch, or let its push on main
      # seed every branch.
      - name: Build the cache key
        if: matrix.leg == 'compile'
        id: texkey
        uses: ./.github/actions/miktex-cache-key

      - name: Restore what the templates need
        if: matrix.leg == 'compile'
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ steps.texkey.outputs.key }}
          path: ${{ steps.texkey.outputs.paths }}
          fail-on-cache-miss: true

      # Bash, as the unit job, in the Git Bash of the runner, and VIM_EXE,
      # because the Git Bash holds a Vim of its own that comes first, see
      # the install-vim action.
      #
      # The verbose log has a name of its own, with no folder, because a
      # path of Windows does not survive the shell, and it is level 2, the
      # files that Vim sources, not the 20 of the unit job: level 20 logs
      # every Ex command of every file, and the colour tests apply a scheme
      # again and again, so on Windows the log grew faster than the tests
      # ran and the suite of tty.vim alone passed ten minutes. The suite
      # that a run reached comes from tests/progress.log instead.
      - name: Run tests
        if: matrix.leg == 'unit'
        shell: bash
        run: |
          # A watchdog of its own, because a job that runs into its
          # timeout-minutes prints nothing, and the suite that a hanging
          # run reached is the only clue to the cause.
          "$VIM_EXE" -es -u NONE -N -V2vim.log \
            -c 'set rtp+=.,deps/Logger' \
            -c 'source tests/harness.vim' -c 'quit' &
          vim_pid=$!
          ( sleep 600; kill -9 "$vim_pid" 2>/dev/null ) &
          dog=$!
          wait "$vim_pid" || true
          kill "$dog" 2>/dev/null || true
          if [ ! -f tests/results.txt ]; then
            echo "::error::tests/results.txt was never created. The suite that the run reached and the last of the verbose log follow:"
            tail -n 3 tests/progress.log || true
            tail -n 200 vim.log
            exit 1
          fi
          cat tests/results.txt
          grep -qx 'All tests passed' tests/results.txt

      # What the stand-in programs of tests/test_texcheck.vim cannot prove:
      # a real MiKTeX, where Bartleby checks no class or package.
      - name: Run the TeX check
        if: matrix.leg == 'texcheck'
        shell: bash
        run: |
          "$VIM_EXE" -es -u NONE -N -V2vim.log \
            -c 'set rtp+=.,deps/Logger' \
            -c 'source tests/test_texcheck_miktex.vim' -c 'quit' || true
          if [ ! -f tests/miktex_results.txt ]; then
            echo "::error::tests/miktex_results.txt was never created - Vim likely failed before finishing. The last of the verbose log follows:"
            tail -n 200 vim.log
            exit 1
          fi
          cat tests/miktex_results.txt
          grep -qx 'All MiKTeX tests passed' tests/miktex_results.txt

      - name: Run compile smoke test
        if: matrix.leg == 'compile'
        shell: bash
        env:
          VIM_LOG: vim.log
          VIM_VERBOSE: 2
        run: .github/scripts/compile-smoke.sh

  tagger-smoke:
    name: Part-of-speech tagger smoke test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Vim
        uses: ./.github/actions/install-vim

      - name: Checkout Logger dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: Galvarcus/Logger
          path: deps/Logger

      # Its own Python, first on PATH, so the tagger's python3 finds spaCy.
      # Ubuntu's system Python refuses pip installs (PEP 668).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install spaCy and its English model
        run: |
          python3 -m pip install spacy
          python3 -m spacy download en_core_web_sm

      - name: Run tagger smoke test
        run: |
          vim -es -u NONE -N -V20/tmp/vim.log \
            -c 'set rtp+=.,deps/Logger' \
            -c 'source tests/test_tagger_smoke.vim' -c 'quit' || true
          if [ ! -f tests/tagger_results.txt ]; then
            echo "::error::tests/tagger_results.txt was never created - Vim likely failed before finishing. Verbose log follows:"
            cat /tmp/vim.log
            exit 1
          fi
          cat tests/tagger_results.txt
          grep -qx 'All tagger tests passed' tests/tagger_results.txt

  # Python only, so nothing to install.
  wiki-tool:
    name: Wiki converter tests
    needs: changes
    if: needs.changes.outputs.wiki == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Test the converter
        run: python3 -m unittest discover -s tools/wiki -p 'test_*.py'

  # Node is on the runner, so nothing to install. The tests also check that the
  # script and the issue templates agree.
  triage-tool:
    name: Issue triage script tests
    needs: changes
    if: needs.changes.outputs.triage == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Test the triage script
        run: node --test .github/scripts/triage.test.js

  # The tests also check that every command of the plugin is on the sheet,
  # so a change to the plugin runs them.
  cheatsheet-tool:
    name: Cheat sheet converter tests
    needs: changes
    if: needs.changes.outputs.cheatsheet == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # xelatex, the fonts, and the PDF tools of the tests are in the CI
    # image, see .github/docker/Dockerfile.
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check the CI image
        run: .github/scripts/check-ci-image.sh

      - name: Test the converter
        env:
          CHEATSHEET_REQUIRE_ENGINE: "1"
        run: python3 -m unittest discover -s tools/cheatsheet -p 'test_*.py' -v

  # The gate. It is the one check that says whether the tests passed, and a
  # job that was skipped because nothing changed counts as passed.
  tests:
    name: Tests
    needs:
      - changes
      - unit
      - compile-smoke
      - windows
      - tagger-smoke
      - wiki-tool
      - cheatsheet-tool
      - triage-tool
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a test failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  ##########################################################################
  # After the tests. These three run side by side. A failure in one does not
  # stop the others, and none of them stops the cheat sheet. Each condition
  # starts with !cancelled(): without a status function GitHub adds
  # success(), which is false when any job before Tests was skipped by its
  # path filter.
  # REFERENCE: https://github.com/actions/runner/issues/491
  # REFERENCE: https://github.com/Galvarcus/bartleby/issues/19
  ##########################################################################

  ghostcode:
    name: GhostCode
    needs: [changes, tests]
    if: >-
      !cancelled()
      && needs.tests.result == 'success'
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Vim
        uses: ./.github/actions/install-vim

      - name: Install GhostCode
        run: |
          mkdir -p "$RUNNER_TEMP/vim/pack/ghostcode/start"

          git clone --depth 1 \
            https://github.com/Galvarcus/Logger.git \
            "$RUNNER_TEMP/vim/pack/ghostcode/start/Logger"

          git clone --depth 1 \
            https://github.com/Galvarcus/GhostCode.git \
            "$RUNNER_TEMP/vim/pack/ghostcode/start/GhostCode"

      - name: Run GhostCode
        id: ghostcode
        run: |
          set +e

          # The exports of Bartleby only serve its own files, so an export that
          # nothing uses is reported too. An older Ghostcode ignores the setting.
          vim \
            -u NONE \
            -N \
            -es \
            --cmd "set rtp+=$RUNNER_TEMP/vim/pack/ghostcode/start/Logger,$RUNNER_TEMP/vim/pack/ghostcode/start/GhostCode" \
            -c 'runtime plugin/ghostcode.vim' \
            -c 'let g:ghostcode_exports_are_api = 0' \
            -c 'let logger_log_file=1' \
            -c 'let logger_log_dir="./"' \
            -c 'GhostCode .' \
            -c 'vim9cmd call writefile(getqflist()->mapnew((_, item) => printf("%s:%d:%d:%s", bufname(item.bufnr), item.lnum, item.col, item.text)), "ghostcode_results.txt")' \
            -c 'vim9cmd call writefile([string(getqflist()->count((_, item) => item.text =~# "^\[ghost\]"))], "ghostcode_count.txt")' \
            -c 'qa!'
          vim_exit=$?
          echo "GHOSTCODE LOG:"
          cat ghostcode*.log
          echo

          if [ "$vim_exit" -ne 0 ]; then
            echo "::error::GhostCode failed to run (Vim exit status $vim_exit)"
            exit "$vim_exit"
          fi

          if [ ! -f ghostcode_results.txt ]; then
            echo "::error::GhostCode did not produce a results file"
            exit 1
          fi

          ghost_count=$(cat ghostcode_count.txt)

          echo "GhostCode results:"
          cat ghostcode_results.txt || true

          echo
          echo "Ghost code findings: $ghost_count"

          if [ "$ghost_count" -eq 0 ]; then
            echo "No ghost code found."
            exit 0
          fi

          echo
          echo "::error::GhostCode found $ghost_count ghost code issue(s)"

          while IFS= read -r result; do
            [ -z "$result" ] && continue

            file=$(printf '%s\n' "$result" | cut -d: -f1)
            line=$(printf '%s\n' "$result" | cut -d: -f2)
            column=$(printf '%s\n' "$result" | cut -d: -f3)
            message=$(printf '%s\n' "$result" | cut -d: -f4-)

            echo "::error file=$file,line=$line,col=$column::$message"
          done < <(grep ':\[ghost\]' ghostcode_results.txt)

          exit 1

      # Only when GhostCode found ghost code or could not run: the log of a
      # clean run tells nothing.
      - name: Archive GhostCode results
        if: failure() && steps.ghostcode.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ghostcode-results
          # The findings beside the log. Without a results file, when GhostCode
          # could not run, the log still uploads.
          path: |
            ghostcode*.log
            ghostcode_results.txt

  vimdoc:
    name: Generate Vimdoc
    needs: [changes, tests]
    if: >-
      !cancelled()
      && needs.tests.result == 'success'
      && needs.changes.outputs.vimdoc == 'true'
      && github.event_name != 'pull_request'
      && (github.ref_name == 'main' || github.ref_name == 'Development')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      # --shift-heading-level-by=-1 makes the README's single H1 the
      # document title instead of a section. The H1 repeats the title line
      # of the help file, and as a section its tag would be the doubled
      # bartleby-bartleby. Keep exactly one H1 in README.md, at the top.
      - name: Generate Vimdoc
        uses: docker://pandoc/core:latest
        with:
          args: >-
            README.md
            --from=markdown
            --to=vimdoc
            --standalone
            --columns=78
            --toc=true
            --shift-heading-level-by=-1
            --metadata-file=doc/pandoc.yaml
            --lua-filter=doc/vimdoc-filter.lua
            --output=doc/bartleby.txt

      - name: Commit generated Vimdoc
        uses: ./.github/actions/commit-generated
        with:
          paths: doc/bartleby.txt
          message: "docs: regenerate Vimdoc"

  wiki:
    name: Publish Wiki
    needs: [changes, tests]
    if: >-
      !cancelled()
      && needs.tests.result == 'success'
      && needs.changes.outputs.wiki == 'true'
      && github.event_name != 'pull_request'
      && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One run at a time, so two pushes cannot race to push the wiki.
    concurrency:
      group: publish-wiki
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The wiki is its own repository, <owner>/<name>.wiki. With
      # contents: write, the workflow's own token can push to it. Only if
      # GitHub refuses that, add a fine-grained personal access token for
      # this repository, with Contents: Read and write, as the secret
      # WIKI_TOKEN. Nothing else needs to change.
      - name: Checkout wiki
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.WIKI_TOKEN || github.token }}

      # Images and relative links load from main, so a changed image shows
      # in the wiki without a new run.
      - name: Build the wiki pages
        run: python3 tools/wiki/build_wiki.py --wiki wiki --repo "${{ github.repository }}" --branch main

      - name: Commit and push the wiki
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is current."
            exit 0
          fi
          git commit -m "docs: rebuild the wiki from ${GITHUB_SHA::7}"
          git push

  ##########################################################################
  # Last. Both this job and the Vimdoc job commit to the branch, so this one
  # waits for the others and checks out the branch as they left it.
  ##########################################################################

  cheatsheet:
    name: Build cheat sheet
    needs: [changes, tests, ghostcode, vimdoc, wiki]
    # !cancelled() and not success(), so that a failure in a job above does
    # not stop this one, when the tests passed.
    if: >-
      !cancelled()
      && needs.tests.result == 'success'
      && needs.changes.outputs.cheatsheet == 'true'
      && github.event_name != 'pull_request'
      && (github.ref_name == 'main' || github.ref_name == 'Development')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    # The engine and the two fonts of the build are in the CI image, see
    # .github/docker/Dockerfile.
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # The history gives the PDF the time of the last commit of its
          # source, so that the same source gives the same file.
          fetch-depth: 0

      - name: Check the CI image
        run: .github/scripts/check-ci-image.sh

      # In the container, the workspace belongs to another user, so git
      # refuses it. The build reads the time of the last commit with git,
      # and without it would give the PDF a new time on every run.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The script knows the names of the source and of the PDF.
      - name: Build the PDF
        id: build
        run: |
          python3 tools/cheatsheet/build_cheatsheet.py
          echo "pdf=$(python3 tools/cheatsheet/build_cheatsheet.py --print-output)" >> "$GITHUB_OUTPUT"

      - name: Commit the PDF
        uses: ./.github/actions/commit-generated
        with:
          paths: ${{ steps.build.outputs.pdf }}
          message: "docs: regenerate cheat sheet"
