name: Issue Triage

# Labels a new or edited issue from what its form holds, asks for what is
# missing, and removes its own labels once the issue is fixed. The logic is in
# .github/scripts/triage.js, which has tests. Run this workflow by hand once,
# to create the labels that the issue templates apply.
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

# contents: read is for the checkout of the script. The text of an issue is
# only read as data by the script, and is never put in a command.
permissions:
  issues: write
  contents: read

# A new edit replaces a run that has not finished.
concurrency:
  group: issue-triage-${{ github.event.issue.number || 'labels' }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triage script
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Triage
        uses: actions/github-script@v9
        with:
          script: |
            const triage = require('./.github/scripts/triage.js');
            await triage.run({github, context, core});
