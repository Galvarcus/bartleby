name: Build Cheat Sheet
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheatsheet-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  cheatsheet:
    name: Build cheat sheet
    # A manual run can start on any branch. Only main and Development build.
    if: github.ref_name == 'main' || github.ref_name == 'Development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The history gives the PDF the time of the last commit of its
          # source, so that the same source gives the same file.
          fetch-depth: 0

      # fonts-texgyre has the text font, and fonts-dejavu-mono the code font.
      # poppler-utils and fontconfig are for the tests.
      - name: Install LaTeX, fonts, and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-recommended fonts-texgyre fonts-dejavu-mono poppler-utils fontconfig

      - name: Test the converter
        env:
          CHEATSHEET_REQUIRE_ENGINE: "1"
        run: python3 -m unittest discover -s tools/cheatsheet -p 'test_*.py' -v

      # The script knows the names of the source and of the PDF.
      - name: Build the PDF
        id: build
        run: |
          python3 tools/cheatsheet/build_cheatsheet.py
          echo "pdf=$(python3 tools/cheatsheet/build_cheatsheet.py --print-output)" >> "$GITHUB_OUTPUT"

      - name: Commit the PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.build.outputs.pdf }}"
          if git diff --cached --quiet; then
            echo "${{ steps.build.outputs.pdf }} is current."
            exit 0
          fi
          git commit -m "docs: regenerate cheat sheet"
          git push origin HEAD:${{ github.ref_name }}
