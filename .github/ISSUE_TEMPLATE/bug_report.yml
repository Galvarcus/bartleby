name: Bug Report
description: Create a bug report to help improve Bartleby
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Bartleby needs Vim 9.2 or later. It does not support Neovim.

        **Before you paste anything,** remove API keys, such as `g:bartleby_dictionary_api_key`, from your vimrc, and remove private text from your manuscript. The text of an issue stays visible in its edit history.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this problem is not reported yet.
          required: true
        - label: I can reproduce the problem with the latest commit of Bartleby.
          required: true
        - label: I can reproduce the problem with only Bartleby and Logger loaded, using the minimal vimrc below.
          required: true
        - label: I removed API keys and private text from this report.
          required: true
  - type: input
    id: commit
    attributes:
      label: Bartleby commit
      description: Output of `git rev-parse --short HEAD` in your Bartleby folder.
      placeholder: e.g., 3f2a9c1
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Vim version
      description: The first lines of `vim --version`, down to the line `Included patches`.
      render: text
      placeholder: |
        VIM - Vi IMproved 9.2 ...
        Included patches: 1-1172
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where do you run Vim?
      options:
        - Terminal Vim
        - gVim
        - MacVim
        - Other GUI Vim
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: e.g., macOS 14.1, Ubuntu 22.04, Windows 11
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Bartleby does the problem seem to be in?
      options:
        - Binder and the scrive tree
        - Panes and windows
        - Corkboard, Outliner, and lists
        - Writing tools (Scrivenings, Focus, Spotlight, Quill)
        - Goals and progress
        - Data on disk (project, session, snapshots, recovery)
        - Compile and language tools (Pandoc, tagger, dictionary)
        - Popups, commands, palette, and menu
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: new-scrive
    attributes:
      label: Does it also happen in a new scrive?
      description: Create one with `:BartlebyNewScrive test`.
      options:
        - "Yes"
        - "No"
        - I did not try
    validations:
      required: true
  - type: dropdown
    id: quill
    attributes:
      label: Does it also happen with Quill off?
      description: Quill remaps keys while you write. Turn it off with `:BartlebyQuill off`.
      options:
        - "Yes"
        - "No"
        - I did not try
        - Not about writing text
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Run `:BartlebyOpen test`
        2. Press `<CR>` on a document in the Binder
        3. Press `gc` to open the Corkboard
    validations:
      required: true
  - type: textarea
    id: minimal-config
    attributes:
      label: Minimal vimrc
      description: A vimrc that loads only Bartleby and Logger, and that still shows the problem. Start Vim with `vim -u that-file`.
      render: vim
      placeholder: |
        set nocompatible
        set rtp+=/path/to/bartleby,/path/to/Logger
        filetype plugin on
        syntax on
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: messages
    attributes:
      label: Error messages and log
      description: Paste the output of `:messages` and of `:LoggerMessages`. To also log to a file, run `let g:logger_log_file = 1` before you reproduce the problem.
      render: text
    validations:
      required: false
