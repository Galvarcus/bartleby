name: Documentation Issue
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Help us keep the documentation accurate and up to date.

        The Vim help file and the wiki are generated from `README.md`, so a fix to the README fixes them too.
  - type: dropdown
    id: doc-type
    attributes:
      label: Type of documentation issue
      options:
        - Typo or grammatical error
        - Missing information / Undocumented feature
        - Unclear or confusing explanation
        - Outdated configuration examples
        - Other
    validations:
      required: true
  - type: dropdown
    id: document
    attributes:
      label: Which document?
      options:
        - README.md
        - Users_Guide.md
        - Cheat sheet (doc/cheatsheet.md)
        - Vim help (:help bartleby)
        - Wiki
        - Localization_README.md
        - Other
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Section or heading
      description: Which section, heading, or table does this issue relate to?
      placeholder: e.g., the table of Binder keys in README.md
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the issue
      description: Please describe what is wrong with the current documentation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: If you know how to fix it, please provide the suggested text.
    validations:
      required: false
