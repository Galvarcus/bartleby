name: Feature Request
description: Suggest an idea, enhancement, or new feature for Bartleby
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature requests! Please provide as much context as possible.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: e.g., When I reorganize a long manuscript, I cannot [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: e.g., A new key in the Binder that [...]
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Bartleby would this change?
      options:
        - Binder and the scrive tree
        - Panes and windows
        - Corkboard, Outliner, and lists
        - Writing tools (Scrivenings, Focus, Spotlight, Quill)
        - Goals and progress
        - Data on disk (project, session, snapshots, recovery)
        - Compile and language tools (Pandoc, tagger, dictionary)
        - Popups, commands, palette, and menu
        - Not sure
    validations:
      required: true
  - type: textarea
    id: similar
    attributes:
      label: Do other writing tools or editors do this?
      description: If you know a similar feature elsewhere, describe how it works. Screenshots and links are welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mappings, or screenshots about the feature request here.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
          required: false
